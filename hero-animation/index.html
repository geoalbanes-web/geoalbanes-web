<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #060608; overflow: hidden; }
    canvas { display: block; }
    [data-composition-id="neural-cosmos"] {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #060608;
      overflow: hidden;
    }
    #cosmos-canvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }
  </style>
</head>
<body>

<div data-composition-id="neural-cosmos" data-start="0" data-width="1920" data-height="1080">

  <canvas id="cosmos-canvas" width="1920" height="1080"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function() {
    const W = 1920, H = 1080, DURATION = 20;

    // ── Seeded PRNG (mulberry32) ──
    function mulberry32(seed) {
      return function() {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(137);

    // ── Stars ──
    const STAR_COUNT = 280;
    const stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: rand() * W,
        y: rand() * H,
        r: rand() * 0.9 + 0.2,
        a: rand() * 0.35 + 0.05,
        twinklePhase: rand() * Math.PI * 2,
        twinkleFreq: rand() * 0.8 + 0.4
      });
    }

    // ── Neural Nodes ──
    // Oscillating positions — loops perfectly in DURATION seconds
    const NODE_COUNT = 72;
    const nodes = [];
    for (let i = 0; i < NODE_COUNT; i++) {
      const cycles = Math.floor(rand() * 3) + 1; // 1, 2, or 3 full cycles in DURATION
      const cyclesY = Math.floor(rand() * 3) + 1;
      nodes.push({
        cx: rand() * W,
        cy: rand() * H,
        freq:  cycles  * (Math.PI * 2 / DURATION),
        freqY: cyclesY * (Math.PI * 2 / DURATION),
        phase:  rand() * Math.PI * 2,
        phaseY: rand() * Math.PI * 2,
        amp:  rand() * 70 + 20,
        ampY: rand() * 55 + 15,
        r: rand() * 2.2 + 0.8,
        pulsePhase: rand() * Math.PI * 2,
        hot: rand() > 0.62
      });
    }

    // ── Meteors (precomputed) ──
    const meteors = [];
    let mt = 1.5;
    while (mt < 17.5) {
      mt += 1.4 + rand() * 2.2;
      const angle = Math.PI * (0.48 + rand() * 0.25); // mostly down-left
      const speed = 420 + rand() * 280;               // px/s
      meteors.push({
        t0: mt,
        dur: 0.65 + rand() * 0.55,
        x0: 700 + rand() * 1100,
        y0: rand() * 320,
        angle: angle,
        speed: speed,
        trailLen: 100 + rand() * 160,
        brightness: 0.75 + rand() * 0.25,
        width: 1.2 + rand() * 1.4
      });
    }

    // ── Signal pulses (precomputed) ──
    const pulses = [];
    let pt = 2.5;
    while (pt < 17) {
      pt += 3.8 + rand() * 2.8;
      pulses.push({
        t0: pt,
        dur: 1.8,
        nodeIdx: Math.floor(rand() * NODE_COUNT),
        maxR: 130 + rand() * 120,
        rings: Math.floor(rand() * 2) + 2
      });
    }

    // ── Data packets traveling along edges ──
    const packets = [];
    let pkt = 1.0;
    while (pkt < 18) {
      pkt += 2.0 + rand() * 2.5;
      const fromIdx = Math.floor(rand() * NODE_COUNT);
      const toIdx   = Math.floor(rand() * NODE_COUNT);
      if (fromIdx !== toIdx) {
        packets.push({ t0: pkt, dur: 0.9 + rand() * 0.6, fromIdx, toIdx });
      }
    }

    // ── Helper: node position at time t ──
    function nodePos(n, t) {
      return {
        x: n.cx + Math.sin(t * n.freq  + n.phase)  * n.amp,
        y: n.cy + Math.cos(t * n.freqY + n.phaseY) * n.ampY
      };
    }

    // ── Canvas ──
    const canvas = document.getElementById('cosmos-canvas');
    const ctx = canvas.getContext('2d');

    // ── Main render function (called by GSAP) ──
    function render(ct) {
      ctx.clearRect(0, 0, W, H);

      // 1 ── Background
      ctx.fillStyle = '#060608';
      ctx.fillRect(0, 0, W, H);

      // Ambient nebula glow (center-right, where content lives)
      const nebula = ctx.createRadialGradient(1380, 480, 0, 1380, 480, 700);
      nebula.addColorStop(0, 'rgba(20,45,110,0.18)');
      nebula.addColorStop(0.5, 'rgba(12,25,70,0.09)');
      nebula.addColorStop(1, 'transparent');
      ctx.fillStyle = nebula;
      ctx.fillRect(0, 0, W, H);

      // Subtle bottom glow
      const bottomGlow = ctx.createLinearGradient(0, H * 0.7, 0, H);
      bottomGlow.addColorStop(0, 'transparent');
      bottomGlow.addColorStop(1, 'rgba(15,30,80,0.12)');
      ctx.fillStyle = bottomGlow;
      ctx.fillRect(0, 0, W, H);

      // 2 ── Stars
      stars.forEach(s => {
        const twinkle = 0.6 + Math.sin(ct * s.twinkleFreq + s.twinklePhase) * 0.4;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(210,225,255,${s.a * twinkle})`;
        ctx.fill();
      });

      // 3 ── Precompute node positions
      const pos = nodes.map(n => nodePos(n, ct));

      // 4 ── Neural connections
      const MAX_DIST = 195;
      ctx.save();
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = pos[i].x - pos[j].x;
          const dy = pos[i].y - pos[j].y;
          const d  = Math.sqrt(dx * dx + dy * dy);
          if (d < MAX_DIST) {
            const base  = (nodes[i].hot || nodes[j].hot) ? 0.52 : 0.20;
            const alpha = base * (1 - d / MAX_DIST);
            ctx.strokeStyle = `rgba(36,96,232,${alpha})`;
            ctx.lineWidth   = nodes[i].hot || nodes[j].hot ? 0.9 : 0.5;
            ctx.beginPath();
            ctx.moveTo(pos[i].x, pos[i].y);
            ctx.lineTo(pos[j].x, pos[j].y);
            ctx.stroke();
          }
        }
      }
      ctx.restore();

      // 5 ── Data packets
      packets.forEach(pk => {
        const el = ct - pk.t0;
        if (el < 0 || el > pk.dur) return;
        const p = el / pk.dur;
        const from = pos[pk.fromIdx];
        const to   = pos[pk.toIdx];
        const px   = from.x + (to.x - from.x) * p;
        const py   = from.y + (to.y - from.y) * p;
        const fade = p < 0.15 ? p / 0.15 : p > 0.85 ? (1 - p) / 0.15 : 1;
        // glow
        const g = ctx.createRadialGradient(px, py, 0, px, py, 10);
        g.addColorStop(0, `rgba(160,200,255,${0.9 * fade})`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(px, py, 10, 0, Math.PI * 2);
        ctx.fill();
        // core dot
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220,235,255,${fade})`;
        ctx.fill();
      });

      // 6 ── Neural nodes
      nodes.forEach((n, i) => {
        const pulse = Math.sin(ct * 1.9 + n.pulsePhase) * 0.5 + 0.5;
        const r     = n.r + pulse * 1.8;
        const alpha = n.hot ? 0.75 + pulse * 0.25 : 0.32 + pulse * 0.18;
        const px    = pos[i].x;
        const py    = pos[i].y;

        if (n.hot) {
          const outerGlow = ctx.createRadialGradient(px, py, 0, px, py, 32);
          outerGlow.addColorStop(0, `rgba(91,142,244,${alpha * 0.65})`);
          outerGlow.addColorStop(0.4, `rgba(36,96,232,${alpha * 0.28})`);
          outerGlow.addColorStop(1, 'transparent');
          ctx.fillStyle = outerGlow;
          ctx.beginPath();
          ctx.arc(px, py, 32, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fillStyle = n.hot
          ? `rgba(91,142,244,${alpha})`
          : `rgba(36,96,232,${alpha})`;
        ctx.fill();
      });

      // 7 ── Signal pulses
      pulses.forEach(pulse => {
        const el = ct - pulse.t0;
        if (el < 0 || el > pulse.dur) return;
        const p    = el / pulse.dur;
        const node = pos[pulse.nodeIdx];
        for (let r = 0; r < pulse.rings; r++) {
          const rp  = Math.max(0, p - r * 0.18);
          if (rp <= 0) continue;
          const rad   = rp * pulse.maxR;
          const alpha = (1 - rp) * (0.65 - r * 0.2);
          if (alpha <= 0) continue;
          ctx.beginPath();
          ctx.arc(node.x, node.y, rad, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(36,96,232,${alpha})`;
          ctx.lineWidth   = 1.5 - r * 0.4;
          ctx.stroke();
        }
      });

      // 8 ── Meteors
      meteors.forEach(m => {
        const el = ct - m.t0;
        if (el < 0 || el > m.dur) return;
        const p = el / m.dur;

        // Ease in/out
        const fade = p < 0.12 ? p / 0.12 : p > 0.75 ? (1 - p) / 0.25 : 1.0;

        // Head position (travels in direction of angle)
        const traveled = p * m.speed * m.dur;
        const hx = m.x0 + Math.cos(m.angle) * traveled;
        const hy = m.y0 + Math.sin(m.angle) * traveled;

        // Slight arc (add perpendicular drift)
        const drift = Math.sin(p * Math.PI) * 18;
        const perpX = Math.cos(m.angle + Math.PI * 0.5) * drift;
        const perpY = Math.sin(m.angle + Math.PI * 0.5) * drift;

        // Draw trail using gradient line
        const SEGS = 28;
        for (let s = 0; s < SEGS; s++) {
          const t0 = s / SEGS;
          const t1 = (s + 1) / SEGS;
          const sp = 1 - t0;  // position along trail (1=head, 0=tail)

          // Trail point
          const trailFrac = t0;
          const tx = hx + Math.cos(m.angle + Math.PI) * trailFrac * m.trailLen + perpX * (1 - sp);
          const ty = hy + Math.sin(m.angle + Math.PI) * trailFrac * m.trailLen + perpY * (1 - sp);

          const segAlpha = sp * sp * fade * m.brightness; // quadratic fade to tail
          if (segAlpha < 0.01) continue;

          const segR = sp * m.width * 2.2 + 0.3;

          // Glow around segment
          const glow = ctx.createRadialGradient(tx, ty, 0, tx, ty, segR * 4);
          if (sp > 0.85) {
            // Head: white-hot
            glow.addColorStop(0, `rgba(255,255,255,${segAlpha * 0.95})`);
            glow.addColorStop(0.3, `rgba(180,215,255,${segAlpha * 0.6})`);
          } else {
            glow.addColorStop(0, `rgba(130,185,255,${segAlpha * 0.7})`);
            glow.addColorStop(0.3, `rgba(36,96,232,${segAlpha * 0.35})`);
          }
          glow.addColorStop(1, 'transparent');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(tx, ty, segR * 4, 0, Math.PI * 2);
          ctx.fill();

          // Solid core
          ctx.beginPath();
          ctx.arc(tx, ty, segR * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = sp > 0.85
            ? `rgba(255,255,255,${segAlpha})`
            : `rgba(160,210,255,${segAlpha * 0.85})`;
          ctx.fill();
        }

        // Bright impact flash at head
        if (p < 0.25) {
          const flashAlpha = (1 - p / 0.25) * 0.6 * m.brightness;
          const flashGlow = ctx.createRadialGradient(hx + perpX, hy + perpY, 0, hx + perpX, hy + perpY, 22);
          flashGlow.addColorStop(0, `rgba(255,255,255,${flashAlpha})`);
          flashGlow.addColorStop(0.5, `rgba(100,180,255,${flashAlpha * 0.4})`);
          flashGlow.addColorStop(1, 'transparent');
          ctx.fillStyle = flashGlow;
          ctx.beginPath();
          ctx.arc(hx + perpX, hy + perpY, 22, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // 9 ── Scanline overlay (subtle techy feel)
      ctx.save();
      ctx.globalAlpha = 0.022;
      for (let y = 0; y < H; y += 3) {
        ctx.fillStyle = 'rgba(0,0,0,1)';
        ctx.fillRect(0, y, W, 1);
      }
      ctx.restore();

      // 10 ── Vignette
      const vignette = ctx.createRadialGradient(W/2, H/2, H * 0.35, W/2, H/2, H * 0.82);
      vignette.addColorStop(0, 'transparent');
      vignette.addColorStop(1, 'rgba(4,4,6,0.55)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, W, H);
    }

    // ── GSAP timeline ──
    window.__timelines = window.__timelines || {};
    const state = { t: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.to(state, {
      t: DURATION,
      duration: DURATION,
      ease: 'none',
      onUpdate: function() { render(state.t); }
    });

    // Initial frame
    render(0);

    window.__timelines['neural-cosmos'] = tl;
  })();
  </script>

</div>
</body>
</html>
